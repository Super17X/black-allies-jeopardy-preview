<html lang="en">

  <meta name="robots" content="noindex">
  <title>Joining Black & Allies Jeopardy…</title>

<body>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const room = (params.get("r") || "").trim().toUpperCase();
  const target = new URL("buzzer.html", location.href);
  if (room) target.searchParams.set("room", room);
  location.replace(target.href);
})();
</script>
<noscript>Please enable JavaScript to join the game.</noscript>
</body>
