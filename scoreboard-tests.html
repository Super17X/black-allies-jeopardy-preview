<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeopardy Scoreboard Tests</title>
<style>body{font-family:system-ui;background:#0b0a10;color:#fff7d6;padding:24px}h1{color:#ffdf6e}.pass{color:#7CFC98}.fail{color:#ff6b6b}code{background:#18151f;padding:2px 5px;border-radius:4px}</style></head>
<body><h1>Scoreboard ranking tests</h1><div id="results"></div><script>
function rankPlayers(players){
  const sorted=players.map((p,i)=>({name:p.name,score:Number(p.score)||0,originalIndex:i})).sort((a,b)=>(b.score-a.score)||a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));
  let previousScore=null,previousRank=0;
  return sorted.map((p,index)=>{const rank=index===0?1:(p.score===previousScore?previousRank:index+1);previousScore=p.score;previousRank=rank;return {...p,rank};});
}
const tests=[
  ["descending scores",[{name:"A",score:300},{name:"B",score:200},{name:"C",score:100}],"A:1,B:2,C:3"],
  ["competition ties 1,2,2,4",[{name:"A",score:400},{name:"B",score:300},{name:"C",score:300},{name:"D",score:100}],"A:1,B:2,C:2,D:4"],
  ["top-score co-winners",[{name:"Zoe",score:500},{name:"Amy",score:500},{name:"Ben",score:200}],"Amy:1,Zoe:1,Ben:3"],
  ["alphabetical display only breaks score ties",[{name:"Zed",score:50},{name:"Ana",score:50},{name:"Moe",score:50}],"Ana:1,Moe:1,Zed:1"],
  ["negative scores rank correctly",[{name:"A",score:-100},{name:"B",score:0},{name:"C",score:-100}],"B:1,A:2,C:2"]
];
const out=document.getElementById("results");let passed=0;
for(const [name,input,expected] of tests){const actual=rankPlayers(input).map(p=>`${p.name}:${p.rank}`).join(",");const ok=actual===expected;passed+=ok?1:0;const p=document.createElement("p");p.className=ok?"pass":"fail";p.textContent=`${ok?"PASS":"FAIL"} — ${name}${ok?"":` (expected ${expected}; got ${actual})`}`;out.appendChild(p)}
const h=document.createElement("h2");h.textContent=`${passed}/${tests.length} tests passed`;h.className=passed===tests.length?"pass":"fail";out.prepend(h);
</script></body></html>
