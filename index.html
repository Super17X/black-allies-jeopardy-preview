<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Black &amp; Allies Jeopardy</title>
  <style>
    :root {
      --bg: #07060a;
      --panel: #0d0b14;
      --panel2: #0b0a10;
      --border: #3a2c00;
      --gold: #f7c948;
      --gold2: #ffdf6e;
      --text: #fff7d6;
      --muted: #e9d8a6;
      --danger: #ff6b6b;
      --ok: #7CFC98;
      --cell: #141023;
      --cell2: #100d1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px clamp(12px, 3vw, 40px) 64px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 20% 0%, #11102b 0%, var(--bg) 60%);
      color: var(--text);
    }
    .hero {
      max-width: 1100px;
      margin: 0 auto 18px;
      padding: 28px 18px;
      border: 1px solid rgba(247,201,72,.48);
      border-radius: 0 0 24px 24px;
      background: linear-gradient(180deg, rgba(8,9,18,.82), rgba(8,9,18,.6));
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.55), 0 0 30px rgba(247,201,72,.12);
    }
    h1 {
      margin: 0;
      color: var(--gold2);
      letter-spacing: .5px;
      font-size: clamp(2rem, 5vw, 4.25rem);
      line-height: 1;
    }
    .tiny { font-size: .9rem; color: var(--muted); }
    .card {
      max-width: 1100px;
      margin: 14px auto;
      padding: 18px 16px;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid var(--border);
      background: linear-gradient(180deg,#1a1526 0%, #0e0b14 100%);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
    }
    .btn.ok {
      background: linear-gradient(180deg,#2a2100 0%, #141000 100%);
      color: var(--gold2);
      border-color: #5a4200;
    }
    .btn.warn {
      background: linear-gradient(180deg,#3a0f0f 0%, #1a0808 100%);
      color: #ffd0d0;
      border-color: #6b1d1d;
    }
    input {
      background: #0a0910;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 220px;
    }
    #buzzerPanel {
      display: none;
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(94vw, 540px);
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
      border: 1px solid rgba(247,201,72,.45);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 80px rgba(247,201,72,.18), 0 16px 48px rgba(0,0,0,.7);
      z-index: 3000;
      text-align: center;
    }
    #buzzerPanel h3 {
      margin: 0 0 6px;
      color: var(--gold2);
      font-size: 1.25rem;
    }
    #buzzerRoom {
      color: var(--gold2);
      margin-bottom: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    #buzzerLink {
      display: inline-block;
      width: 100%;
      background: #0a0910;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--gold2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-all;
      margin-bottom: 12px;
      text-align: left;
    }
    #buzzerQr {
      display: block;
      margin: 16px auto;
      width: 300px;
      height: 300px;
      max-width: min(300px, 78vw);
      background: #fff;
      border: 16px solid #fff;
      border-radius: 12px;
      box-sizing: content-box;
      box-shadow: 0 0 0 2px rgba(247,201,72,.65), 0 10px 30px rgba(0,0,0,.45);
    }
    #lobbyList { margin-top: 14px; }
    .pill {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--muted);
      background: #090811;
    }
    @media (max-width: 560px) {
      body { padding-inline: 8px; }
      .card { padding: 12px; }
      input { width: 100%; min-width: 0; }
      #buzzerQr { width: 220px; height: 220px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Black &amp; Allies Jeopardy</h1>
    <p class="tiny">A live multiplayer game-show experience</p>
  </header>

  <div id="lobbyPane" class="card">
    <h2 style="margin:0 0 10px; color:var(--gold2);">Game Lobby</h2>
    <div class="row">
      <label for="nameInput" class="tiny">Player name:</label>
      <input id="nameInput" placeholder="Player name" aria-label="Player name" />
      <button id="addPlayerBtn" class="btn ok" type="button">Add player</button>
      <button id="clearPlayersBtn" class="btn warn" type="button">Clear</button>
      <button id="lobbyBuzzerLinkBtn" class="btn" type="button">📱 Show Player QR Code</button>
    </div>
    <div id="lobbyList" class="tiny"></div>
  </div>

  <div id="buzzerPanel" aria-modal="true" role="dialog">
    <h3>📱 Virtual Buzzer</h3>
    <div id="buzzerRoom" class="tiny">Room: —</div>
    <div id="buzzerLink">—</div>
    <canvas id="buzzerQr" width="300" height="300" aria-label="QR code for buzzer page"></canvas>
    <div class="row">
      <button class="btn warn" id="closeBuzzerPanelBtn" type="button">Close Panel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.5.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script>
    function sanitizeRoomCode(value) {
      return String(value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "ROOM";
    }

    function ensureRoomCode() {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = sanitizeRoomCode(params.get("room") || params.get("r"));
      const existing = sanitizeRoomCode(window.currentRoomCode || document.body.dataset.roomCode || fromQuery);
      if (existing && existing !== "ROOM") {
        window.currentRoomCode = existing;
        return existing;
      }
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let room = "";
      for (let i = 0; i < 6; i++) room += chars[Math.floor(Math.random() * chars.length)];
      window.currentRoomCode = room;
      return room;
    }

    function resolveBuzzerUrl(room) {
      const code = sanitizeRoomCode(room || ensureRoomCode());
      const url = new URL("buzzer.html", window.location.href);
      url.searchParams.set("room", code);
      return url.toString();
    }

    function renderBuzzerQr(roomCode) {
      const qrNode = document.getElementById("buzzerQr");
      const roomNode = document.getElementById("buzzerRoom");
      const linkNode = document.getElementById("buzzerLink");
      if (!qrNode || !roomNode || !linkNode) return;

      const room = sanitizeRoomCode(roomCode || ensureRoomCode());
      const finalUrl = resolveBuzzerUrl(room);

      roomNode.textContent = `Room: ${room}`;
      linkNode.textContent = finalUrl;

      if (!window.qrcode) {
        qrNode.getContext("2d").clearRect(0, 0, qrNode.width, qrNode.height);
        return;
      }

      try {
        const qr = qrcode(0, "H");
        qr.addData(finalUrl);
        qr.make();
        const svg = qr.createSvgTag({
          cellSize: 4,
          margin: 2,
          scalable: true
        });
        qrNode.innerHTML = svg;
        const svgEl = qrNode.querySelector("svg");
        if (svgEl) {
          svgEl.setAttribute("width", "300");
          svgEl.setAttribute("height", "300");
          svgEl.setAttribute("viewBox", "0 0 300 300");
        }
      } catch (err) {
        console.warn("Unable to render QR code", err);
        qrNode.innerHTML = "";
      }
    }

    function openBuzzerPanel(roomCode) {
      const panel = document.getElementById("buzzerPanel");
      if (panel) panel.style.display = "block";
      renderBuzzerQr(roomCode || ensureRoomCode());
    }

    document.addEventListener("DOMContentLoaded", () => {
      ensureRoomCode();
      const addPlayerBtn = document.getElementById("addPlayerBtn");
      const clearPlayersBtn = document.getElementById("clearPlayersBtn");
      const lobbyList = document.getElementById("lobbyList");
      const nameInput = document.getElementById("nameInput");
      const lobbyBuzzerLinkBtn = document.getElementById("lobbyBuzzerLinkBtn");
      const closeBuzzerPanelBtn = document.getElementById("closeBuzzerPanelBtn");

      const players = [];
      function refreshList() {
        if (!lobbyList) return;
        if (!players.length) {
          lobbyList.innerHTML = "<span class=" + '"tiny"' + ">No players yet.</span>";
          return;
        }
        lobbyList.innerHTML = players
          .map((player, index) => `<span class="pill" style="margin:4px">${index + 1}. ${player}</span>`)
          .join(" ");
      }

      addPlayerBtn?.addEventListener("click", () => {
        const name = (nameInput?.value || "").trim();
        if (!name) return;
        players.push(name);
        if (nameInput) nameInput.value = "";
        refreshList();
      });

      clearPlayersBtn?.addEventListener("click", () => {
        players.length = 0;
        refreshList();
      });

      lobbyBuzzerLinkBtn?.addEventListener("click", () => {
        openBuzzerPanel(ensureRoomCode());
      });

      closeBuzzerPanelBtn?.addEventListener("click", () => {
        const panel = document.getElementById("buzzerPanel");
        if (panel) panel.style.display = "none";
      });

      refreshList();
      renderBuzzerQr(ensureRoomCode());
    });
  </script>
</body>
</html>
