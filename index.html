  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.5.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script>
  function sanitizeRoomCode(value) {
    return String(value || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "")
      .slice(0, 8) || "ROOM";
  }

  function ensureRoomCode() {
    const params = new URLSearchParams(window.location.search);
    const fromQuery = sanitizeRoomCode(params.get("room") || params.get("r"));
    const existing = sanitizeRoomCode(window.currentRoomCode || document.body.dataset.roomCode || fromQuery);
    if (existing && existing !== "ROOM") {
      window.currentRoomCode = existing;
      return existing;
    }

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let room = "";
    for (let i = 0; i < 6; i++) {
      room += chars[Math.floor(Math.random() * chars.length)];
    }
    window.currentRoomCode = room;
    return room;
  }

  function resolveBuzzerUrl(room) {
    const code = sanitizeRoomCode(room || ensureRoomCode());
    const url = new URL(window.location.href);

    if (url.protocol !== "file:") {
      const basePath = url.pathname.replace(/\/index\.html?$/i, "/");
      const resolved = new URL("buzzer.html", url.origin + basePath);
      resolved.searchParams.set("room", code);
      return resolved.toString();
    }

    // Fallback for local/file:// use: use the public GitHub Pages URL for the project.
    return `https://super17x.github.io/black-allies-jeopardy-preview/buzzer.html?room=${encodeURIComponent(code)}`;
  }

  function getCurrentRoomCode() {
    return sanitizeRoomCode(window.currentRoomCode || document.body.dataset.roomCode || (new URLSearchParams(window.location.search)).get("room") || (new URLSearchParams(window.location.search)).get("r") || ensureRoomCode());
  }

  function renderBuzzerQr(roomCode) {
    const qrNode = document.getElementById("buzzerQr");
    const roomNode = document.getElementById("buzzerRoom");
    const linkNode = document.getElementById("buzzerLink");
    if (!qrNode || !roomNode || !linkNode) return;

    const room = sanitizeRoomCode(roomCode || getCurrentRoomCode() || ensureRoomCode());
    const finalUrl = resolveBuzzerUrl(room);

    roomNode.textContent = `Room: ${room}`;
    linkNode.textContent = finalUrl;

    if (!window.qrcode) {
      qrNode.innerHTML = "";
      return;
    }

    try {
      const qr = qrcode(0, "H");
      qr.addData(finalUrl);
      qr.make();
      qrNode.innerHTML = qr.createSvgTag({
        cellSize: 4,
        margin: 2,
        scalable: true
      });
      const svg = qrNode.querySelector("svg");
      if (svg) {
        svg.setAttribute("width", "300");
        svg.setAttribute("height", "300");
        svg.setAttribute("viewBox", "0 0 300 300");
      }
    } catch (err) {
      console.warn("Unable to render QR code", err);
      qrNode.innerHTML = "";
    }
  }

  function openBuzzerPanel(roomCode) {
    const panel = document.getElementById("buzzerPanel");
    const actualRoom = ensureRoomCode();
    if (panel) panel.style.display = "block";
    renderBuzzerQr(roomCode || actualRoom);
  }

  document.addEventListener("DOMContentLoaded", () => {
    ensureRoomCode();

    const openerButtons = [
      document.getElementById("lobbyBuzzerLinkBtn"),
      document.getElementById("buzzerLinkBtn"),
      document.getElementById("showBuzzerPanelBtn")
    ].filter(Boolean);

    openerButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        openBuzzerPanel(getCurrentRoomCode());
      });
    });

    const panelCloseBtn = document.getElementById("closeBuzzerPanelBtn");
    if (panelCloseBtn) {
      panelCloseBtn.addEventListener("click", () => {
        const panel = document.getElementById("buzzerPanel");
        if (panel) panel.style.display = "none";
      });
    }

    renderBuzzerQr(getCurrentRoomCode());
  });
  (() => {
    // -----------------------------
    // Ticker
    // -----------------------------
    const historicWinners = [
      { year: 1978, winner: "Walter Bruss", winnings: "$34,000" },
      { year: 1995, winner: "Quincy Jones", winnings: "$60,000" },
      { year: 2001, winner: "Ken Jennings", winnings: "$2,520,700" },
      { year: 2020, winner: "Hannah Wilson", winnings: "$45,200" }
    ];
    const tickerContent = document.querySelector("#ticker .ticker-content");
    function initTicker(){
      tickerContent.textContent = historicWinners
        .map(g => `${g.year}: ${g.winner} — ${g.winnings}`)
        .join("   |   ");
    }
    window.addEventListener("load", initTicker);
