<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Score ticker preview</title><link rel="stylesheet" href="assets/score-ticker.css"><style>body{margin:0;background:#050c20;color:#ffe175;font-family:Arial,sans-serif}main{padding:30px}h1{font-size:28px}p{color:#d6dfef}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.board div{padding:24px 8px;text-align:center;border:1px solid #259aff;border-radius:8px;background:linear-gradient(#0a4795,#061d55);font-size:24px;font-weight:bold}button.demo{margin:22px 8px 0 0;padding:12px 18px;border:1px solid #e9bd49;background:#111e38;color:#ffe175;border-radius:6px}#leaderboardTicker{display:flex;position:fixed;color:#fff;font-weight:800}#leaderboardTicker .tickerLabel{height:100%;box-sizing:border-box;flex-shrink:0}#leaderboardTicker .tickerViewport{flex:1}#leaderboardTicker .tickerTrack{white-space:nowrap}@media(max-width:500px){main{padding:16px}.board div{font-size:17px;padding:22px 4px}}</style></head><body><main><h1>BLACK &amp; ALLIES JEOPARDY</h1><p>Score ticker design preview • Sample players and scores</p><div class="board"><div>HISTORY</div><div>90s HIP-HOP</div><div>INVENTORS</div><div>BLACK TV</div><div>$200</div><div>$200</div><div>$200</div><div>$200</div><div>$400</div><div>$400</div><div>$400</div><div>$400</div><div>$600</div><div>$600</div><div>$600</div><div>$600</div></div><button class="demo" id="update">Simulate score update</button><button class="demo" id="many">Show 15 players</button></main><div id="leaderboardTicker" aria-label="Live leaderboard"><div class="tickerLabel">LIVE SCORES<small>BLACK &amp; ALLIES</small></div><div class="tickerViewport"><div class="tickerTrack" id="leaderboardTickerTrack"></div></div></div><script>
let players=[['Chris',2400],['Jordan',1800],['Maya',1600],['Alex',1200],['Taylor',800]];
function render(){players.sort((a,b)=>b[1]-a[1]);document.getElementById('leaderboardTickerTrack').innerHTML=players.map((p,i)=>`<span class="tickerPlayer ${i===0?'tickerLeader':''}">${i===0?'🏆 ':''}${i+1}. ${p[0]} <strong>$${p[1].toLocaleString()}</strong>${i===0?' • CONTROL':''}</span>`).join('')}
render();document.getElementById('update').onclick=()=>{players[2][1]+=1000;render()};document.getElementById('many').onclick=()=>{players=Array.from({length:15},(_,i)=>['Player '+(i+1),3000-i*200]);render()};
</script><script src="assets/score-ticker.js"></script></body></html>
